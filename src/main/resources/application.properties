spring.application.name=tadmor
spring.main.banner-mode=off

# The libpq-style URL every tadmor implementation takes (DatabaseConfig).
tadmor.database-url=${DATABASE_URL:}
# The From address of outgoing mail; the SMTP server comes from SMTP_ADDR (TadmorApplication).
tadmor.mail-from=${MAIL_FROM:}

# Users come from the shared users table, not Spring's generated default user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.threads.virtual.enabled=true
spring.jackson.property-naming-strategy=SNAKE_CASE
