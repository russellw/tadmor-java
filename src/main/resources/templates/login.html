<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · tadmor</title>
</head>
<body>
<main>
  <h1>Sign in to tadmor</h1>
  <p th:if="${error}" th:text="${error}" role="alert">Invalid email or password.</p>
  <form th:action="@{/login}" method="post">
    <label>Email <input type="email" name="email" th:value="${email}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
