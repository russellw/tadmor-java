<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Reset password · tadmor</title></head>
<body>
<main>
  <div class="pagehead"><h1>Reset password</h1></div>
  <p th:text="'For ' + ${user.fullName()} + ' (' + ${user.email()} + '). Their sessions end when it changes.'">For someone.</p>
  <p class="error" role="alert" th:if="${error}" th:text="${error}">Refused.</p>
  <form class="form card" method="post" th:action="@{'/users/' + ${user.id()} + '/password'}">
    <label class="field"><span>New password (at least 8 characters)</span>
      <input type="password" name="password" autocomplete="new-password" required></label>
    <div class="actions"><button type="submit" class="primary">Reset password</button>
      <a class="button" th:href="@{/users}">Cancel</a></div>
  </form>
</main>
</body>
</html>
